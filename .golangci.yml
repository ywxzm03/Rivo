version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [misspell]
        path: internal/llm/api/openai/responses/convert_test.go
        text: cancelled
      - linters: [misspell]
        path: internal/llm/api/openai/responses/stream_abort_test.go
        text: cancelled
      - linters: [misspell]
        path: internal/tool/codemode/types.go
        text: cancelled
      - linters: [misspell]
        path: internal/tui/model.go
        text: cancelled
      - linters: [misspell]
        path: internal/tui/editor.go
        text: Cancelling
      - linters: [misspell]
        path: internal/tui/toolrow_diff.go
        text: Colour
