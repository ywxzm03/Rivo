name: CI

concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number))
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run fast tests
        run: go test -short ./...

      - name: Run full tests
        run: go test ./...

  race:
    name: Race (ubuntu)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race tests
        run: go test -race ./...

  e2e:
    name: E2E (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run process-level E2E
        run: go test -tags=e2e ./test/e2e/...

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Check subagent coverage threshold
        run: |
          go test -coverprofile=subagent-coverage.txt -covermode=atomic ./internal/app ./internal/subagent ./internal/task ./internal/tool/agenttool ./internal/tui ./internal/tui/adapter
          coverage=$(go tool cover -func=subagent-coverage.txt | awk '$1 == "total:" {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf "subagent coverage %.1f%% is below 80%%\n", coverage; exit 1 } }'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

